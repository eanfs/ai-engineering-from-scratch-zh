    [35.97, 40.17, '角度随位置增加，点积里就只剩相对距离。'],
    [40.50, 46.04, '位置加三，和位置加一千，只要间隔相同，分数就完全一样。'],
    [46.37, 48.15, '第三代，ALiBi。'],
    [48.47, 51.30, '连嵌入都不加，只按距离扣分。'],
    [51.61, 53.73, '近的抬高，远的压低。'],
    [54.04, 55.91, '每个头，一个斜率。'],
    [56.27, 60.08, '外推很好，但 2026 年的主流，是 RoPE。'],
    [60.44, 64.28, 'Llama、Qwen、Mistral、DeepSeek，都在转。'],
    [64.61, 67.96, '位置，不是加进去的，是转进去的。'],
  ];
  let lastSub = -1;

  // ---- drawing helpers ----------------------------------------------------
  const arrowTip = (c, ang, r) => [c.x + r * Math.cos(ang), c.y - r * Math.sin(ang)];

  function waveY(i, pos) {
    return W.y0 + i * W.gap - Math.sin(pos * Math.pow(10000, -2 * i / W.d)) * W.amp;
  }
  function wavePath(i, posEnd) {
    let d = '', started = false;
    for (let p = 0; p <= posEnd + 0.001; p += 0.4) {
      const x = W.x + (p / W.posMax) * W.w;
      const y = waveY(i, p);
      d += (started ? ' L' : 'M') + x.toFixed(2) + ' ' + y.toFixed(2);
      started = true;
    }
    return d;
  }

  function draw(t) {
    // 01
    setOp(g1, fade(t, T.hook, T.blind, 0.35, 0.18));
    if (t < T.blind + 0.4) {
      const p = ease(clamp((t - 0.9) / 0.85));
      const o0 = g1.__order0, o1 = g1.__order1;
      const tokX0 = 500, tokW = 140, tokGap = 16, tokY = 250;
      g1.__tokens.forEach((g, i) => {
        const q = ease(clamp((p - i * 0.035) / 0.46));
        const sy = Math.max(0.02, Math.abs(Math.cos(Math.PI * q)));
        const slot = q < 0.5 ? o0[i] : o1[i];
        g.setAttribute('transform', 'translate(' + (tokX0 + slot * (tokW + tokGap)) + ',' + tokY + ') scale(1,' + sy.toFixed(3) + ')');
      });
      const mX0 = 807, mY0 = 470, cell = 48, gap = 3;
      const swap = p < 0.5 ? o0 : o1;
      g1.__cells.forEach((c) => {
        c.el.setAttribute('x', (mX0 + swap[c.j] * (cell + gap)).toFixed(2));
        c.el.setAttribute('y', (mY0 + swap[c.i] * (cell + gap)).toFixed(2));
      });
      g1.__mtx.setAttribute('opacity', (1 - 0.55 * Math.sin(Math.PI * p)).toFixed(3));
      g1.__cap.setAttribute('opacity', appear(t, 1.75, 0.4).toFixed(3));
      g1.__tag.setAttribute('opacity', appear(t, 2.02, 0.35).toFixed(3));
    }

    // 02
    setOp(g2, fade(t, T.blind, T.why, 0.35, 0.18));
    g2.__box.setAttribute('stroke-dashoffset', (2200 * (1 - appear(t, T.blind + 0.55, 0.9))).toFixed(1));
    const su = ((t - T.blind) % 3.2) / 3.2;
    g2.__scan.setAttribute('cx', (196 + 812 * su).toFixed(2));
    g2.__scan.setAttribute('opacity', (0.85 * appear(t, T.blind + 0.9, 0.4)).toFixed(2));

    // 03
    setOp(g3, fade(t, T.why, T.inject, 0.35, 0.18));

    // 04
    setOp(g4, fade(t, T.inject, T.sine, 0.35, 0.18));
    g4.__roads.forEach((r, i) => {
      r.path.setAttribute('stroke-dashoffset', (1 - appear(t, T.inject + 0.35 + i * 0.22, 0.7)).toFixed(3));
      const u = (((t - T.inject - 0.9) * 0.42 + i * 0.31) % 1 + 1) % 1;
      try {
        const pt = r.path.getPointAtLength(r.path.getTotalLength() * u);
        r.dot.setAttribute('cx', pt.x.toFixed(2));
        r.dot.setAttribute('cy', pt.y.toFixed(2));
      } catch (e) { /* path not laid out yet */ }
      r.dot.setAttribute('opacity', (0.9 * appear(t, T.inject + 1.1 + i * 0.2, 0.5)).toFixed(2));
    });

    // 05 / 06 / 07 / 08 share the wave field
    setOp(g5, fade(t, T.sine, T.rope + 0.3, 0.5, 0.5));
    setOp(g6, fade(t, T.waves, T.phase + 0.3));
    setOp(g7, fade(t, T.phase, T.wall + 0.3));
    setOp(g8, fade(t, T.wall, T.rope + 0.3));
    g5.__waves.forEach((w) => {
      const rev = ease(clamp((t - (T.sine + 0.18 + w.i * 0.12)) / 1.15));
      w.el.setAttribute('d', rev > 0.002 ? wavePath(w.i, W.posMax * rev) : '');
      const emph = t >= T.waves ? (w.i === 0 || w.i === 5 ? 1 : 0.4) : 1;
      w.el.setAttribute('opacity', emph.toFixed(2));
      w.lab.setAttribute('opacity', (0.8 * emph).toFixed(2));
    });
    if (t >= T.phase - 0.5) {
      const cp = ease(clamp((t - T.phase - 0.1) / 1.3));
      const pos = PROBE * cp;
      const cx = W.x + (pos / W.posMax) * W.w;
      g7.__cursor.setAttribute('stroke-dashoffset', (-t * 24).toFixed(1));
    g7.__cursor.setAttribute('x1', cx.toFixed(2));
      g7.__cursor.setAttribute('x2', cx.toFixed(2));
      g7.__dots.forEach((d, i) => {
        d.setAttribute('cx', cx.toFixed(2));
        d.setAttribute('cy', waveY(i, pos).toFixed(2));
        d.setAttribute('opacity', cp.toFixed(2));
      });
      g7.__fp.forEach((tx, i) => {
        const val = Math.sin(PROBE * Math.pow(10000, -2 * i / W.d));
        tx.textContent = 'i=' + i + '   ' + (val >= 0 ? '+' : '') + val.toFixed(3);
        tx.setAttribute('opacity', (cp * (i === 0 || i === 5 ? 1 : 0.55)).toFixed(2));
      });
    }
    if (t >= T.wall) {
      const wp = ease(clamp((t - T.wall - 0.15) / 0.7));
      g8.setAttribute('opacity', wp.toFixed(3));
      g8.__wall.setAttribute('stroke-dashoffset', (-t * 18).toFixed(1));
    }

    // 09
    setOp(g9, fade(t, T.rope, T.relative, 0.35, 0.18));
    if (t > T.rope - 0.2) {
      const a = 0.35 + Math.max(0, t - T.rope) * 0.95;
      const b = a + 2;
      const [qx, qy] = arrowTip(C9, a, C9.r);
      const [kx, ky] = arrowTip(C9, b, C9.r);
      g9.__q.setAttribute('x2', qx.toFixed(2)); g9.__q.setAttribute('y2', qy.toFixed(2));
      g9.__k.setAttribute('x2', kx.toFixed(2)); g9.__k.setAttribute('y2', ky.toFixed(2));
      g9.__ql.setAttribute('x', (qx + 16).toFixed(2)); g9.__ql.setAttribute('y', (qy - 6).toFixed(2));
      g9.__kl.setAttribute('x', (kx + 16).toFixed(2)); g9.__kl.setAttribute('y', (ky - 6).toFixed(2));
      g9.__arc.setAttribute('d', 'M' + qx.toFixed(2) + ' ' + qy.toFixed(2) + ' A' + (C9.r + 26) + ' ' + (C9.r + 26) + ' 0 0 0 ' + kx.toFixed(2) + ' ' + ky.toFixed(2));
      g9.__ang.textContent = 'pos · θ ≈ ' + a.toFixed(2) + ' rad';
    }

    // 10
    setOp(g10, fade(t, T.relative, T.hero, 0.35, 0.18));
    if (t > T.relative - 0.2) {
      const base = 0.55 + Math.max(0, t - T.relative) * 0.75;
      g10.__pairs.forEach((p, i) => {
        const a = base + i * 2.35;
        const b = a + 2;
        const [qx, qy] = arrowTip(p.c, a, p.c.r);
        const [kx, ky] = arrowTip(p.c, b, p.c.r);
        p.q.setAttribute('x2', qx.toFixed(2)); p.q.setAttribute('y2', qy.toFixed(2));
        p.k.setAttribute('x2', kx.toFixed(2)); p.k.setAttribute('y2', ky.toFixed(2));
        p.arc.setAttribute('d', 'M' + qx.toFixed(2) + ' ' + qy.toFixed(2) + ' A' + p.c.r + ' ' + p.c.r + ' 0 0 0 ' + kx.toFixed(2) + ' ' + ky.toFixed(2));
        p.lab.textContent = '夹角 2θ';
      });
    }

    // 11
    setOp(g11, fade(t, T.hero, T.alibi, 0.4, 0.18));
    if (t > T.hero - 0.3) {
      g11.__rows.forEach((r, i) => {
        const p = appear(t, T.hero + 0.35 + i * 0.82, 0.38);
        r.setAttribute('opacity', p.toFixed(3));
        r.setAttribute('transform', 'translate(0,' + ((1 - p) * 22).toFixed(2) + ')');
      });
      g11.__box.setAttribute('opacity', appear(t, T.hero + 3.7, 0.4).toFixed(3));
      g11.__box.setAttribute('stroke-dasharray', '12 9');
      g11.__box.setAttribute('stroke-dashoffset', (-t * 22).toFixed(1));
      const vp = appear(t, T.hero + 4.6, 0.5);
      g11.__verdict.setAttribute('opacity', vp.toFixed(3));
      const vs = 1 + 0.022 * Math.sin(t * 2.4);
      g11.__verdict.setAttribute('transform', 'translate(960,872) scale(' + vs.toFixed(4) + ') translate(-960,-872)');
      g11.__side.setAttribute('opacity', (0.7 * appear(t, T.hero + 5.4, 0.6)).toFixed(3));
    }

    // 12
    setOp(g12, fade(t, T.alibi, T.slopes, 0.35, 0.18));
    if (t > T.alibi - 0.2) {
      const p = appear(t, T.bias, 0.5);
      g12.__row.setAttribute('opacity', (0.9 * p).toFixed(3));
      g12.__slopeTexts.forEach((tx, i) => tx.setAttribute('opacity', (0.45 + 0.55 * appear(t, T.alibi + 0.3 + i * 0.25, 0.4)).toFixed(2)));
    }

    // 13
    setOp(g13, fade(t, T.slopes, T.verdict, 0.35, 0.18));
    g13.__bars.forEach((b, i) => {
      const p = appear(t, T.slopes + 0.15 + i * 0.3, 0.55);
      const w = (b.s / 0.25) * 760 * ease(p);
      b.bar.setAttribute('width', w.toFixed(2));
      b.val.setAttribute('x', (350 + w + 18).toFixed(2));
      b.val.setAttribute('opacity', p.toFixed(2));
    });

    // 14
    setOp(g14, fade(t, T.verdict, T.models, 0.35, 0.18));
    g14.__hi.setAttribute('opacity', (0.55 * appear(t, T.verdict + 0.4, 0.6) * (0.86 + 0.14 * Math.sin(t * 2.1))).toFixed(3));
    g14.__hi.setAttribute('stroke-dasharray', '10 8');
    g14.__hi.setAttribute('stroke-dashoffset', (-t * 20).toFixed(1));
    g14.__verdict.setAttribute('opacity', appear(t, T.verdict + 3.4, 0.55).toFixed(3));

    // 15
    setOp(g15, fade(t, T.models, T.end, 0.25, 0.18));
    const mt = [T.models, cue('Qwen'), cue('Mistral'), cue('DeepSeek')];
    g15.__cards.forEach((c, i) => {
      const p = clamp((t - mt[i]) / 0.38);
      const s = 1.12 - 0.12 * outBack(p);
      c.g.setAttribute('opacity', ease(p).toFixed(3));
      c.g.setAttribute('transform', 'translate(' + (224 + i * 384) + ',320) scale(' + s.toFixed(3) + ')');
      const rot = (t - mt[i]) * (60 + i * 20);
      c.ring.setAttribute('transform', 'translate(160,92) rotate(' + rot.toFixed(1) + ')');
    });
    g15.__cap.setAttribute('opacity', appear(t, cue('都在'), 0.45).toFixed(3));

    // 16
    setOp(g16, fade(t, T.end, T.endFilm + 0.5, 0.5, 0.4));
    g16.__ring.setAttribute('transform', 'translate(960,290) rotate(' + ((t - T.end) * 42).toFixed(1) + ')');

    world.setAttribute('transform', 'translate(960,540) scale(' + (1.0015 + 0.0018 * Math.sin(t * 0.21)).toFixed(5) + ') translate(-960,-540) translate(' + (Math.sin(t * 0.17) * 4).toFixed(2) + ',' + (Math.cos(t * 0.13) * 3).toFixed(2) + ')');

    // a dot crossing each distance line while the score stays the same
    if (t > T.why - 0.3 && t < T.inject + 0.4) {
      g3.__lines.forEach((l) => l.setAttribute('stroke-dashoffset', (-t * 26).toFixed(1)));
    g3.__dots.forEach((d) => {
        const u = (t * 0.45 + d.phase) % 1;
        d.el.setAttribute('cx', lerp(d.x1 + 28, d.x2 - 28, ease(u)).toFixed(2));
      });
    }

    // the read-head crossing the sinusoidal field before the probe locks on
    if (t >= T.sine && t < T.phase) {
      const u = clamp((t - T.sine - 0.2) / (T.phase - T.sine - 0.2));
      const x = W.x + u * W.w;
      const vis = 0.6 * Math.min(1, (t - T.sine) / 0.6);
      g5.__sweep.setAttribute('x1', x.toFixed(2));
      g5.__sweep.setAttribute('x2', x.toFixed(2));
      g5.__sweep.setAttribute('stroke-dashoffset', (-t * 30).toFixed(1));
      g5.__sweep.setAttribute('opacity', vis.toFixed(2));
      const wy = waveY(2, u * W.posMax);
      g5.__sweepDot.setAttribute('cx', x.toFixed(2));
      g5.__sweepDot.setAttribute('cy', wy.toFixed(2));
      g5.__sweepDot.setAttribute('opacity', vis.toFixed(2));
      g5.__pos.textContent = 'pos ' + Math.round(u * W.posMax);
      g5.__pos.setAttribute('x', x.toFixed(2));
      g5.__pos.setAttribute('opacity', vis.toFixed(2));
    } else {
      g5.__sweep.setAttribute('opacity', 0);
      g5.__sweepDot.setAttribute('opacity', 0);
      g5.__pos.setAttribute('opacity', 0);
    }

    // HUD + subtitles
    prog.setAttribute('width', (1396 * clamp(t / T.endFilm)).toFixed(1));
    let idx = -1;
    for (let i = 0; i < SUBS.length; i++) if (t >= SUBS[i][0] && t <= SUBS[i][1]) { idx = i; break; }
    if (t >= T.end + 0.35) idx = -1;
    if (idx !== lastSub) {
      lastSub = idx;
      if (idx >= 0) sub.textContent = SUBS[idx][2];
    }
    const sa = idx >= 0 ? 1 : 0;
    sub.setAttribute('opacity', sa);
    subPlate.setAttribute('opacity', (0.72 * sa).toFixed(2));
  }

  // ---- timeline -----------------------------------------------------------
  const tl = gsap.timeline({ paused: true });
  const S = [
    ['hook', T.hook], ['blind', T.blind], ['why', T.why], ['inject', T.inject],
    ['sine', T.sine], ['waves', T.waves], ['phase', T.phase], ['wall', T.wall],
    ['rope', T.rope], ['relative', T.relative], ['hero', T.hero], ['alibi', T.alibi],
    ['bias', T.bias], ['slopes', T.slopes], ['verdict', T.verdict], ['models', T.models], ['end', T.end],
  ];
  S.forEach(([name, at]) => tl.addLabel('scene:' + name, at));
  OM.clock(tl, draw, T.endFilm);
  window.__timelines['film'] = tl;

  // ---- sound marks --------------------------------------------------------
  OM.music({ style: 'mallet', bpm: 104, drop: 'hero', ending: 'ring' });
  OM.sfx('whoosh', 0.9, { gain: .28 });
  OM.sfx('tick', 2.02, { gain: .3 });
  OM.sfx('tick', T.why + 0.2, { gain: .28 });
  OM.sfx('whoosh', T.inject + 0.2, { gain: .3 });
  OM.sfx('pop', T.sine, { gain: .32, note: 1 });
  OM.sfx('tick', T.waves, { gain: .24 });
  OM.sfx('pop', T.phase, { gain: .3, note: 2 });
  OM.sfx('thud', T.wall + 0.1, { gain: .32 });
  OM.sfx('whoosh', T.rope, { gain: .3 });
  OM.sfx('pop', T.rope + 0.7, { gain: .26, note: 3 });
  OM.sfx('tick', T.relative, { gain: .26 });
  [0, 0.82, 1.64, 2.46].forEach((d, i) => OM.sfx('tick', T.hero + 0.35 + d, { gain: .3, note: i + 1 }));
  OM.sfx('impact', T.hero + 3.7, { gain: .45 });
  OM.sfx('thud', T.alibi, { gain: .3 });
  OM.sfx('pop', T.alibi + 0.7, { gain: .3, note: 4 });
  OM.sfx('tick', T.bias, { gain: .26 });
  [0, 0.3, 0.6, 0.9].forEach((d, i) => OM.sfx('tick', T.slopes + 0.15 + d, { gain: .24, note: i + 1 }));
  OM.sfx('tick', T.verdict, { gain: .26 });
  OM.sfx('chime', T.verdict + 3.4, { gain: .4 });
  [0, 0.64, 1.41, 2.26].forEach((d, i) => OM.sfx('hit', T.models + d, { gain: .4 + i * .03, pitch: 1 + i * .06 }));
  OM.sfx('impact', T.end, { gain: .5 });
  OM.sfx('chime', T.endFilm - 1.2, { gain: .35 });
})();
</script>
</body>
</html>
